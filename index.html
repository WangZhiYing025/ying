
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明陽來村｜宅配申請表</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 15px;
  background: #f3f6ef;
  color: #344638;
  font-family: "Microsoft JhengHei", sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 5px 20px #00000012;
}

.header {
  background: #41664c;
  color: white;
  text-align: center;
  padding: 35px 15px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.form {
  padding: 30px;
}

h2 {
  color: #41664c;
  font-size: 21px;
  border-left: 5px solid #9ab69b;
  padding-left: 12px;
  margin: 25px 0 20px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d5dfd5;
  border-radius: 9px;
  font-size: 16px;
  margin-bottom: 18px;
  font-family: inherit;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

input:focus, textarea:focus {
  outline: 2px solid #9ab69b;
}

.time {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: center;
}

.notice {
  background: #fff4df;
  color: #805b28;
  padding: 17px;
  border-radius: 10px;
  line-height: 1.8;
  margin: 15px 0 25px;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: #41664c;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #304e38;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#message {
  text-align: center;
  margin-top: 18px;
  font-weight: bold;
  line-height: 1.7;
}

@media(max-width:480px) {
  .form { padding: 22px 18px; }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <h1>🌿 明陽來村</h1>
    <p>宅配申請表</p>
    <p>歡迎填寫宅配資料</p>
  </header>

  <main class="form">

    <form id="deliveryForm">

      <h2>申請人資料</h2>

      <label>姓名 *</label>
      <input name="name" type="text"
             placeholder="請輸入姓名" required
             maxlength="50">

      <label>聯絡電話 *</label>
      <input name="phone" type="tel"
             placeholder="請輸入聯絡電話"
             inputmode="tel" required
             maxlength="20">

      <label>宅配地址 *</label>
      <textarea name="address"
                placeholder="請填寫完整宅配地址"
                required maxlength="300"></textarea>

      <h2>購買資訊</h2>

      <label>購買物品 *</label>
      <textarea name="items"
                placeholder="請填寫購買物品及數量"
                required maxlength="1000"></textarea>

      <h2>方便收貨時間</h2>

      <label>方便時間段 *</label>

      <div class="time">
        <input type="time" name="timeStart"
               min="12:00" required>
        <span>～</span>
        <input type="time" name="timeEnd"
               min="12:00" required>
      </div>

      <div class="notice">
        <strong>📢 宅配注意事項</strong><br>
        1. 送貨時間皆安排於下午時段。<br>
        2. 確定好送貨日期後，將會以電話聯絡您。<br>
        3. 請確認聯絡電話及宅配地址正確。<br>
        感謝您的配合！
      </div>

      <button type="submit" id="submitBtn">
        送出宅配申請
      </button>

      <div id="message" role="status" aria-live="polite"></div>

    </form>

    <!-- 隱藏的接收畫面，不會出現在網站 -->
    <iframe name="submitFrame"
            id="submitFrame"
            title="申請資料傳送"
            style="display:none"></iframe>

  </main>
</div>

<script>

// 你的 Google Apps Script 原本網址
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz_cYVOzqymYK39GTLGcQ1oOs-6em4lgMOTYtAT0fq-kQDfC2xLv5msT5MzKiZ0Kklb/exec";

const form = document.getElementById("deliveryForm");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");
const frame = document.getElementById("submitFrame");

let submitting = false;
let currentRequestId = "";

window.addEventListener("message", function(event) {

  const result = event.data;

  if (!result || result.source !== "mingyang-delivery") {
    return;
  }

  if (result.requestId !== currentRequestId) {
    return;
  }

  submitting = false;
  button.disabled = false;
  button.textContent = "送出宅配申請";

  if (result.status === "success") {

    message.style.color = "#41664c";
    message.textContent =
      "✓ 申請成功！資料已存入系統，確認送貨日期後將以電話聯絡您。";

    form.reset();

  } else {

    message.style.color = "#c0392b";
    message.textContent =
      "送出失敗：" + (result.message || "請稍後再試。");

  }

});

form.addEventListener("submit", function(e) {

  e.preventDefault();

  if (submitting) return;

  const data = Object.fromEntries(new FormData(form));

  if (data.timeStart < "12:00" ||
      data.timeEnd < "12:00") {

    alert("宅配時間皆安排於下午時段！");
    return;
  }

  if (data.timeEnd <= data.timeStart) {

    alert("結束時間必須晚於開始時間！");
    return;
  }

  submitting = true;

  currentRequestId =
    Date.now().toString() + Math.random().toString(36).slice(2);

  button.disabled = true;
  button.textContent = "資料傳送中...";

  message.style.color = "#805b28";
  message.textContent = "正在傳送申請資料，請稍候...";

  // 建立真正的表單 POST 請求
  const sendForm = document.createElement("form");

  sendForm.method = "POST";
  sendForm.action = SCRIPT_URL;
  sendForm.target = "submitFrame";
  sendForm.style.display = "none";

  const payload = {
    ...data,
    requestId: currentRequestId
  };

  Object.entries(payload).forEach(([key, value]) => {

    const input = document.createElement("input");

    input.type = "hidden";
    input.name = key;
    input.value = value;

    sendForm.appendChild(input);

  });

  document.body.appendChild(sendForm);
  sendForm.submit();
  sendForm.remove();

  // 等待後端回覆，避免一直停留在傳送中
  window.setTimeout(function() {

    if (submitting) {

      submitting = false;
      button.disabled = false;
      button.textContent = "重新送出宅配申請";

      message.style.color = "#c0392b";
      message.textContent =
        "目前尚未收到系統確認，請先檢查試算表是否已有紀錄，避免重複申請。";

    }

  }, 20000);

});

</script>

</body>
</html>
