
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明陽來村｜宅配申請表</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 15px;
  background: #f3f6ef;
  color: #344638;
  font-family: "Microsoft JhengHei", sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 5px 20px #00000012;
}

.header {
  background: #41664c;
  color: white;
  text-align: center;
  padding: 35px 15px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.form {
  padding: 30px;
}

h2 {
  color: #41664c;
  font-size: 21px;
  border-left: 5px solid #9ab69b;
  padding-left: 12px;
  margin: 25px 0 20px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d5dfd5;
  border-radius: 9px;
  font-size: 16px;
  margin-bottom: 18px;
  font-family: inherit;
}

textarea { min-height: 90px; }

.time {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: center;
}

.notice {
  background: #fff4df;
  color: #805b28;
  padding: 17px;
  border-radius: 10px;
  line-height: 1.8;
  margin: 15px 0 25px;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: #41664c;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

#message {
  text-align: center;
  margin-top: 18px;
  font-weight: bold;
}

@media(max-width:480px) {
  .form { padding: 22px 18px; }
}
</style>
</head>

<body>

<!-- 全網站只保留這一份申請表 -->
<div class="container">

  <header class="header">
    <h1>🌿 明陽來村</h1>
    <p>宅配申請表</p>
    <p>歡迎填寫宅配資料</p>
  </header>

  <main class="form">

    <form id="deliveryForm">

      <h2>申請人資料</h2>

      <label>姓名 *</label>
      <input name="name" type="text"
             placeholder="請輸入姓名" required>

      <label>聯絡電話 *</label>
      <input name="phone" type="tel"
             placeholder="請輸入聯絡電話" required>

      <label>宅配地址 *</label>
      <textarea name="address"
                placeholder="請填寫完整宅配地址"
                required></textarea>

      <h2>購買資訊</h2>

      <label>購買物品 *</label>
      <textarea name="items"
                placeholder="請填寫購買物品及數量"
                required></textarea>

      <h2>方便收貨時間</h2>

      <label>方便時間段 *</label>

      <div class="time">
        <input type="time" name="timeStart"
               min="12:00" required>
        <span>～</span>
        <input type="time" name="timeEnd"
               min="12:00" required>
      </div>

      <div class="notice">
        <strong>📢 宅配注意事項</strong><br>
        1. 送貨時間皆安排於下午時段。<br>
        2. 確定好送貨日期後，將會以電話聯絡您。<br>
        3. 請確認聯絡電話及宅配地址正確。<br>
        感謝您的配合！
      </div>

      <button type="submit" id="submitBtn">
        送出宅配申請
      </button>

      <div id="message"></div>

    </form>

  </main>
</div>

<script>

// 請保留你原本部署好的 Google Apps Script 網址
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgeWhH7TP3nb4sHtg1W4bMMm_tzH48j2mi29hDP0pVHOOiVQJQfHiLlhLtwePIvYZx/exec";

const form = document.getElementById("deliveryForm");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async function(e) {

  e.preventDefault();

  const data = Object.fromEntries(new FormData(form));

  if (data.timeStart < "12:00" ||
      data.timeEnd < "12:00") {
    alert("宅配時間皆安排於下午時段！");
    return;
  }

  if (data.timeEnd <= data.timeStart) {
    alert("結束時間必須晚於開始時間！");
    return;
  }

  button.disabled = true;
  button.textContent = "資料傳送中...";

  try {

    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: new URLSearchParams(data)
    });

    message.style.color = "#41664c";
    message.textContent =
      "感謝您！請留意後續電話聯絡。";

    form.reset();

  } catch (error) {

    message.style.color = "red";
    message.textContent =
      "送出失敗，請稍後再試。";

  } finally {

    button.disabled = false;
    button.textContent = "送出宅配申請";

  }

});

</script>

</body>
</html>
