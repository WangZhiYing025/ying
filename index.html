
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明陽來村｜宅配申請</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: "Noto Sans TC", sans-serif;
    background: #f3f5f1;
    color: #333;
}

.container {
    max-width: 520px;
    margin: 30px auto;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 20px #00000012;
}

.header {
    background: #315b45;
    color: white;
    text-align: center;
    padding: 35px 20px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 4px;
}

.header p {
    margin-bottom: 0;
    font-size: 14px;
}

.form-area {
    padding: 25px;
}

h2 {
    color: #315b45;
    font-size: 21px;
}

label {
    display: block;
    margin: 18px 0 8px;
    font-weight: bold;
}

input, textarea, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 16px;
    background: white;
}

textarea {
    resize: vertical;
    min-height: 85px;
}

.time-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.time-row select {
    flex: 1;
}

.notice {
    margin-top: 25px;
    padding: 16px;
    background: #edf3ed;
    border-radius: 10px;
    color: #315b45;
    line-height: 1.8;
    font-size: 14px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 16px;
    background: #315b45;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #254735;
}

.footer {
    text-align: center;
    padding: 15px;
    color: #999;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>明陽來村</h1>
        <p>宅配申請表單</p>
        <p>歡迎填寫宅配資料</p>
    </div>

    <div class="form-area">

        <h2>宅配資料填寫</h2>

        <form
          action="https://formsubmit.co/YOUR_EMAIL"
          method="POST"
          id="deliveryForm">

            <input type="hidden" name="_subject"
            value="明陽來村｜新宅配申請">

            <input type="hidden" name="_captcha"
            value="true">

            <label>姓名 *</label>
            <input
              type="text"
              name="姓名"
              placeholder="請輸入您的姓名"
              required>

            <label>聯絡電話 *</label>
            <input
              type="tel"
              name="聯絡電話"
              placeholder="請輸入聯絡電話"
              pattern="[0-9+\-\s()]{8,20}"
              required>

            <label>宅配地址 *</label>
            <textarea
              name="宅配地址"
              placeholder="請輸入完整宅配地址"
              required></textarea>

            <label>購買物品 *</label>
            <textarea
              name="購買物品"
              placeholder="請填寫購買物品及數量"
              required></textarea>

            <label>希望送貨日期 *</label>
            <input
              type="date"
              name="希望送貨日期"
              id="deliveryDate"
              required>

            <label>方便收貨時間 *</label>

            <div class="time-row">

                <select name="開始時間"
                id="startTime" required>
                </select>

                <span>～</span>

                <select name="結束時間"
                id="endTime" required>
                </select>

            </div>

            <div class="notice">
                <strong>溫馨提醒</strong><br>
                1. 送貨時間皆為下午時段。<br>
                2. 請確認填寫的聯絡電話及宅配地址。<br>
                3. 確定好送貨日期後會電話聯絡！
            </div>

            <button type="submit">
                提交宅配申請
            </button>

        </form>
    </div>

    <div class="footer">
        © 明陽來村｜宅配服務
    </div>

</div>

<script>

// 設定可選擇時間：12:00～17:00
const start = document.getElementById("startTime");
const end = document.getElementById("endTime");

function addTimes(select) {
    for (let hour = 12; hour <= 17; hour++) {
        for (let minute = 0; minute < 60; minute += 30) {

            if (hour === 17 && minute > 0) continue;

            let time =
                String(hour).padStart(2, "0") + ":" +
                String(minute).padStart(2, "0");

            let option = document.createElement("option");
            option.value = time;
            option.textContent = time;

            select.appendChild(option);
        }
    }
}

addTimes(start);
addTimes(end);

// 結束時間必須晚於開始時間
function updateEndTimes() {
    const selectedStart = start.value;

    Array.from(end.options).forEach(option => {
        option.disabled = option.value <= selectedStart;
    });

    if (end.value <= selectedStart) {
        const next = Array.from(end.options).find(
            option => option.value > selectedStart
        );

        if (next) end.value = next.value;
    }
}

start.addEventListener("change", updateEndTimes);
updateEndTimes();

// 不允許選擇過去日期
const today = new Date();
const localToday = new Date(
    today.getTime() - today.getTimezoneOffset() * 60000
).toISOString().split("T")[0];

document.getElementById("deliveryDate").min = localToday;

</script>

</body>
</html>
